[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

# The workspace's own tasks, run by `cargo xtask <task>`, the alias in
# `.cargo/config.toml`. Its code names nothing of the workspace, whose
# facts are its root Cargo.toml's, so this directory copies verbatim
# into any Rust workspace.

[dependencies]
# The argument parser and its completion engine, so `cargo xtask <tab>`
# asks this binary for its tasks.
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
# The crate cargo's own `cargo add` edits a manifest with: it keeps
# the comments, the layout, and the key order, and changes the one
# value.
toml_edit = "0.25"
# `cargo metadata`'s JSON: the target directory, the binaries, and the
# workspace's `[workspace.metadata.xtask]`.
serde_json = "1"
